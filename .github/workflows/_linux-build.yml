name: Linux build

on:
  workflow_call:
    inputs:
      package_release:
        description: Package the successful build for publication
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Linux build and smoke
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore npm download cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('.nvmrc', 'samples/view-text/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Restore pip download cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('baseline.env', 'requirements-ci.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Restore Godot source cache
        id: godot-source-cache
        uses: actions/cache/restore@v5
        with:
          path: godot
          key: godot-source-${{ runner.os }}-${{ hashFiles('baseline.env', 'scripts/bootstrap.sh') }}

      - name: Load pinned Hermes commit
        run: grep '^HERMES_COMMIT=' baseline.env >> "$GITHUB_ENV"

      - name: Restore Hermes library cache
        id: hermes-library-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            modules/react_native_bindings/engines/build_release/lib/libhermesvm.so
            modules/react_native_bindings/engines/build_release/jsi/libjsi.so
          key: hermes-${{ runner.os }}-gcc13-${{ env.HERMES_COMMIT }}-${{ hashFiles('scripts/build_hermes.sh') }}
          restore-keys: |
            hermes-${{ runner.os }}-gcc13-${{ hashFiles('baseline.env', '.gitmodules', 'scripts/build_hermes.sh') }}

      - name: Check Hermes libraries
        id: hermes-libraries
        run: |
          HERMES_BUILD_DIR=modules/react_native_bindings/engines/build_release
          if [[ -f "$HERMES_BUILD_DIR/lib/libhermesvm.so" && -f "$HERMES_BUILD_DIR/jsi/libjsi.so" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore compiler caches
        uses: actions/cache@v5
        with:
          path: |
            .scons-cache
            .ccache
          key: compiler-${{ runner.os }}-gcc13-${{ hashFiles('baseline.env', 'scripts/build_godot.sh', 'modules/react_native_bindings/SCsub', 'modules/react_native_bindings/*.cpp', 'modules/react_native_bindings/*.h', 'modules/react_native_bindings/editor/**', 'modules/react_native_bindings/fabric/**', 'modules/react_native_bindings/root_view/**', 'modules/react_native_bindings/singletons/**', 'modules/react_native_bindings/tests/**', 'modules/react_native_bindings/thirdparty/yoga/**', '.github/workflows/_linux-build.yml') }}
          restore-keys: |
            compiler-${{ runner.os }}-gcc13-

      - name: Install native toolchain
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTIONS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::ForceIPv4=true
          )
          sudo apt-get "${APT_OPTIONS[@]}" update
          sudo apt-get "${APT_OPTIONS[@]}" install --yes ccache cmake gcc-13 g++-13 libicu-dev libreadline-dev ninja-build zip
          python -m pip install --requirement requirements-ci.txt

      - name: Bootstrap pinned sources
        run: scripts/bootstrap.sh

      - name: Save clean Godot source cache
        if: steps.godot-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: godot
          key: ${{ steps.godot-source-cache.outputs.cache-primary-key }}

      - name: Validate metadata and scripts
        run: |
          scripts/verify_provenance.py
          python3 -m unittest discover -s scripts/tests

      - name: Build Hermes
        if: steps.hermes-libraries.outputs.available != 'true'
        run: |
          set -o pipefail
          scripts/build_hermes.sh 2>&1 | tee hermes-build.log

      - name: Save Hermes library cache
        if: steps.hermes-library-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            modules/react_native_bindings/engines/build_release/lib/libhermesvm.so
            modules/react_native_bindings/engines/build_release/jsi/libjsi.so
          key: ${{ steps.hermes-library-cache.outputs.cache-primary-key }}

      - name: Build Godot and module
        run: |
          set -o pipefail
          scripts/build_godot.sh -j2 \
            cpp_compiler_launcher=ccache \
            c_compiler_launcher=ccache \
            cache_path=${{ github.workspace }}/.scons-cache \
            cache_limit=4 \
            accesskit=no \
            module_mono_enabled=no \
            module_openxr_enabled=no \
            module_webxr_enabled=no \
            module_jolt_physics_enabled=no \
            module_raycast_enabled=no \
            module_lightmapper_rd_enabled=no \
            module_basis_universal_enabled=no \
            module_theora_enabled=no \
            module_webrtc_enabled=no \
            module_mobile_vr_enabled=no \
            2>&1 | tee godot-build.log

      - name: Run module unit tests
        run: |
          GODOT_BINARY=$(find godot/bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor.*' -perm -u+x -print -quit)
          "$GODOT_BINARY" --headless --test --test-case='*[ReactNativeBindings]*'

      - name: Run headless smoke tests
        run: scripts/run_baseline.sh

      - name: Package Linux baseline
        if: inputs.package_release
        run: scripts/package_linux_baseline.sh

      - name: Upload release package
        if: inputs.package_release
        uses: actions/upload-artifact@v5
        with:
          name: linux-baseline-package
          retention-days: 1
          if-no-files-found: error
          path: |
            artifacts/react-native-godot-linux-x86_64.zip
            artifacts/react-native-godot-linux-x86_64.zip.sha256

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: linux-baseline-failure
          if-no-files-found: ignore
          path: |
            hermes-build.log
            godot-build.log
            artifacts/smoke-logs/*.log
