name: Linux build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Linux build and smoke
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/prepare-linux-build
        with:
          hermes-variant: linux-x86_64-debugger
          extra-packages: clang-format xvfb xauth libgl1-mesa-dri

      - name: Restore SCons cache
        id: scons-cache
        uses: actions/cache/restore@v5
        with:
          path: .scons-cache
          key: scons-${{ runner.os }}-gcc13-${{ hashFiles('baseline.env', 'requirements-ci.txt', 'scripts/build_godot.sh', 'modules/react_native_bindings/SCsub', 'modules/react_native_bindings/config.py', 'modules/react_native_bindings/*.cpp', 'modules/react_native_bindings/*.h', 'modules/react_native_bindings/components/**', 'modules/react_native_bindings/editor/**', 'samples/libraries/react-native-godot-example/godot/**', 'samples/libraries/react-native-godot-example/specs/**', 'modules/react_native_bindings/input/**', 'modules/react_native_bindings/interop/**', 'modules/react_native_bindings/mounting/**', 'modules/react_native_bindings/native_modules/**', 'modules/react_native_bindings/root_view/**', 'modules/react_native_bindings/singletons/**', 'modules/react_native_bindings/tests/**', 'modules/react_native_bindings/react_native_sources.py', 'modules/react_native_bindings/react_platform/**', 'modules/react_native_bindings/generated/**', 'modules/react_native_bindings/host/**', 'modules/react_native_bindings/turbomodules/**', '.github/workflows/_linux-build.yml') }}
          restore-keys: |
            scons-${{ runner.os }}-gcc13-

      - name: Validate metadata and scripts
        run: |
          scripts/verify_provenance.py
          scripts/check_format.sh
          python3 -m unittest discover -s scripts/tests

      - name: Test Godot JavaScript platform
        run: |
          npm --prefix packages/react-native-godot ci
          node packages/react-native-godot/scripts/codegen.cjs
          git diff --exit-code modules/react_native_bindings/generated
          node packages/react-native-godot/scripts/check-overrides.cjs
          npm --prefix packages/react-native-godot test
          npm --prefix samples/view-text ci
          npm --prefix samples/game-ui ci
          (cd samples/view-text && npx react-native autolink-godot)
          (cd samples/game-ui && npx react-native autolink-godot --check)

      - name: Build Godot and module
        id: build
        env:
          RN_AUTOLINKING: samples/view-text/node_modules/.cache/react-native-godot/autolinking/autolinking.json
        run: |
          set -o pipefail
          scripts/build_godot.sh -j"$(nproc)" \
            cache_path=${{ github.workspace }}/.scons-cache \
            cache_limit=6 \
            module_mono_enabled=no \
            module_openxr_enabled=no \
            module_webxr_enabled=no \
            module_jolt_physics_enabled=no \
            module_raycast_enabled=no \
            module_lightmapper_rd_enabled=no \
            module_basis_universal_enabled=no \
            module_webrtc_enabled=no \
            module_mobile_vr_enabled=no \
            2>&1 | tee godot-build.log

      - name: Summarize SCons cache use
        if: always() && hashFiles('godot-build.log') != ''
        env:
          MATCHED_KEY: ${{ steps.scons-cache.outputs.cache-matched-key }}
        run: |
          {
            echo "SCons cache restored from: ${MATCHED_KEY:-nothing}"
            echo
            echo "Targets retrieved from the cache: $(grep -c '^Retrieved ' godot-build.log || true)"
            echo
            echo "Files compiled: $(grep -c 'Compiling ' godot-build.log || true)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Saved even when the build or a later step fails, so the next run builds only
      # what changed. A failed build's partial cache goes under an attempt-specific key:
      # later runs still restore it by prefix, but never hit it exactly and skip
      # saving the complete one.
      - name: Save SCons cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' && steps.scons-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .scons-cache
          key: ${{ steps.build.outcome == 'success' && steps.scons-cache.outputs.cache-primary-key || format('{0}-failed-{1}-{2}', steps.scons-cache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

      - name: Run module unit tests
        run: |
          GODOT_BINARY=$(find godot/bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor.*' -perm -u+x -print -quit)
          "$GODOT_BINARY" --headless --test --test-case='*[ReactNativeBindings]*'

      - name: Run headless smoke tests
        run: scripts/run_baseline.sh

      - name: Check generated component contracts
        run: git diff --exit-code -- samples/*/godot samples/*/components

      - name: Run native component display checks
        run: scripts/run_component_display.sh

      - name: Run visual regression checks
        run: scripts/run_visual_regression.sh

      - name: Run the staged game demo
        run: scripts/run_staged_game.sh

      - name: Run a consumer project
        run: scripts/run_consumer.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: linux-baseline-failure
          if-no-files-found: ignore
          path: |
            hermes-build.log
            godot-build.log
            artifacts/smoke-logs/**
            artifacts/visual/**
