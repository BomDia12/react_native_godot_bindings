name: Linux baseline

on:
  pull_request:
    branches:
      - main
      - feature/phase8-*
      - feature/phase9-*
  # Pull requests fall back to the caches saved on main, which GitHub evicts after
  # 7 days without use.
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

concurrency:
  group: linux-baseline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    name: Linux baseline
    uses: ./.github/workflows/_linux-build.yml
    with:
      package_release: false
